---
# yamllint disable rule:line-length
name: OWASP
'on':
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - master


jobs:
  owasp:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache vulnerability data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-${{ hashFiles('pom.xml') }}-
      - name: Maven
        run: |
            if [ -z "${NVD_API_KEY:-}" ]; then
                echo "No NVD API key is available; updating vulnerability data anonymously"
            fi
            mvn --errors --batch-mode -Powasp "-DdataDirectory=${RUNNER_TEMP}/dependency-check-data" dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
